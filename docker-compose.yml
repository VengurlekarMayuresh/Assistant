version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# RepoMind AI — Docker Compose (Cloud DB Mode)
#
# All databases are hosted externally on cloud services:
#   MongoDB  →  MongoDB Atlas   (mongodb+srv://...)
#   Qdrant   →  Qdrant Cloud    (https://xxx.cloud.qdrant.io)
#   Neo4j    →  Neo4j AuraDB   (neo4j+s://xxx.databases.neo4j.io)
#
# Set all connection strings in your .env file before running.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── Backend API ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repomind-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend:/app

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repomind-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
